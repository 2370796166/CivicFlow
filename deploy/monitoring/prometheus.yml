global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: civicflow
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/civicflow-monitoring-token
    static_configs:
      - targets:
          - gateway:8080
          - auth:8081
          - resource:8082
          - appointment:8083
          - queue:8084
