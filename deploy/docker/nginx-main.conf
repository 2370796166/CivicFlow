worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    log_format civicflow escape=json '{"time":"$time_iso8601","service":"civicflow-web","level":"INFO","method":"$request_method","status":$status,"upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout civicflow;
    error_log /dev/stderr error;
    include /etc/nginx/conf.d/*.conf;
}
