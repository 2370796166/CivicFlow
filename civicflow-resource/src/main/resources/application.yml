spring:
  application:
    name: civicflow-resource
  profiles:
    default: dev

mybatis-plus:
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

server:
  port: ${CIVICFLOW_RESOURCE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
