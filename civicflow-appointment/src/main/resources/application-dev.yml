spring:
  config:
    import: "optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:CIVICFLOW_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:CIVICFLOW_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:CIVICFLOW_GROUP}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    openfeign:
      sentinel:
        enabled: true
  datasource:
    url: "${CIVICFLOW_APPOINTMENT_DB_URL:jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/civicflow_appointment?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: ${CIVICFLOW_APPOINTMENT_DB_APP_USERNAME:civicflow_appointment_app}
    password: ${CIVICFLOW_APPOINTMENT_DB_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:civicflow}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:civicflow}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  flyway:
    enabled: true
    url: "${CIVICFLOW_APPOINTMENT_DB_URL:jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/civicflow_appointment?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    user: ${CIVICFLOW_APPOINTMENT_DB_MIGRATION_USERNAME:civicflow_appointment_migration}
    password: ${CIVICFLOW_APPOINTMENT_DB_MIGRATION_PASSWORD:}
