spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false
    openfeign:
      sentinel:
        enabled: false
  datasource:
    url: jdbc:h2:mem:civicflow_appointment;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

civicflow:
  appointment:
    jwt:
      allow-test-decoder: true
    preheat:
      enabled: false

management:
  health:
    nacos:
      enabled: false
    rabbit:
      enabled: false
    redis:
      enabled: false
