spring:
  application:
    name: civicflow-notification
  profiles:
    default: dev
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
mybatis-plus:
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
server:
  port: ${CIVICFLOW_NOTIFICATION_PORT:8085}
civicflow:
  notification:
    jwt:
      issuer: ${CIVICFLOW_JWT_ISSUER:https://auth.civicflow.local}
      audience: ${CIVICFLOW_JWT_AUDIENCE:civicflow-api}
      jwk-set-uri: ${CIVICFLOW_JWKS_URI:http://civicflow-auth:8081/.well-known/jwks.json}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
